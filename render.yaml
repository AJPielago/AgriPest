services:
  - type: web
    name: pest-detection-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DETECTION_MODE
        value: mock
      - key: UPLOAD_DIR
        value: ./uploads

