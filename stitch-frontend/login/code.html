<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AgriMonitor - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "primary-fixed": "#97f5cc",
                        "on-tertiary-container": "#e4e9ff",
                        "on-tertiary-fixed": "#131b2e",
                        "on-secondary-container": "#007230",
                        "tertiary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "secondary-fixed": "#7ffc97",
                        "surface-bright": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "surface-variant": "#d3e4fe",
                        "secondary-container": "#7cf994",
                        "on-error-container": "#93000a",
                        "outline-variant": "#bdc9c1",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#9ffdd3",
                        "error": "#ba1a1a",
                        "outline": "#6e7a73",
                        "surface-container-low": "#eff4ff",
                        "background": "#f8f9ff",
                        "on-background": "#0b1c30",
                        "on-surface-variant": "#3e4943",
                        "surface": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#002109",
                        "on-surface": "#0b1c30",
                        "primary": "#005d42",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#616980",
                        "secondary": "#006e2d",
                        "primary-container": "#047857",
                        "inverse-primary": "#7bd8b1",
                        "secondary-fixed-dim": "#62df7d",
                        "surface-dim": "#cbdbf5",
                        "on-primary-fixed-variant": "#00513a",
                        "inverse-surface": "#213145",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#7bd8b1",
                        "surface-tint": "#006c4e",
                        "on-secondary-fixed-variant": "#005320",
                        "on-primary-fixed": "#002115",
                        "tertiary-fixed": "#dae2fd",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary": "#495167"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-margin": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "gutter-grid": "12px",
                        "stack-lg": "24px",
                        "section-gap": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-full flex flex-col antialiased">
<!-- Navigation intentionally suppressed for Login/Transactional Screen -->
<main class="flex-1 flex flex-col justify-center px-container-margin py-section-gap w-full max-w-md mx-auto h-full">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mb-section-gap">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-[32px] text-on-primary-container">agriculture</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-primary mb-stack-sm leading-tight">
                Pest Detection and Farm Monitoring Management System
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">
                Monitor your farm, detect pests, and manage your crops efficiently.
            </p>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-stack-lg">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email/Username Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary transition-colors outline-none" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 bg-surface border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary/10 focus:border-primary transition-colors outline-none" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-unit mb-unit">
<div class="flex items-center">
<input class="h-4 w-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2 focus:ring-offset-1 focus:ring-offset-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md font-bold text-on-primary bg-primary-container hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                    Login
                </button>
</form>
</div>
<!-- Footer Info -->
<div class="mt-section-gap text-center">
<p class="font-label-sm text-label-sm text-outline">
                © 2024 AgriMonitor. All rights reserved.
            </p>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
