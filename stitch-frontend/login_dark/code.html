<!DOCTYPE html>

                    },
                    "borderRadius": {

                    "spacing": {
                        "section-gap": "32px",
                        "container-margin": "16px",
                        "gutter-grid": "12px",

<body class="bg-background text-on-surface font-body-md h-screen w-screen flex items-center justify-center overflow-hidden relative">
<div class="absolute inset-0 w-full h-full z-0 opacity-20 pointer-events-none" data-alt="A highly detailed, ultra-realistic aerial view of a sprawling modern agricultural farm at night. The fields are illuminated by precision LED grow lights casting a high-tech emerald green glow across the landscape. The scene is shot from a low atmospheric angle, emphasizing the vast scale and geometric precision of the crop rows. The overall aesthetic is cinematic, dark, moody, and deeply aligned with precision agriculture and smart farming technology." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDtDaeCByvZ5VzHkjgImwxUbwy59ApuxAyKY_4FVn-lPlTzR2Jpsi0W-yvCU318u--vCHJ7I8zLB79jLb2AEd-WMxv6-jn38842dQLtiAOL5OzKTe2H44qhhjnyL_LbQ7bbkdME6gpGvDkeJuB1ReNCI-DwjE3hd87-fEDGV9mDmksGiMe92yfo1Pzh19Fc9GHL4_zaMapu_p-BQI_b-HWRR_BqZ3FuEOLcucZs9bo3MkOoiFs_hRj3')"></div>
<div class="relative z-10 w-full max-w-md p-8 md:p-12 bg-surface rounded-xl border border-outline shadow-2xl backdrop-blur-sm bg-opacity-95 flex flex-col gap-stack-lg">
<div class="flex flex-col items-center gap-stack-sm text-center">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-unit">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface">AgriMonitor</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Precision farm management and pest detection platform.</p>
</div>
<form class="flex flex-col gap-stack-md mt-4">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-low border border-outline rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="email" placeholder="admin@agrimonitor.farm" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-low border border-outline rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors outline-none" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-unit">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5">
<input class="peer appearance-none w-5 h-5 border border-outline rounded bg-surface-container-low checked:bg-primary checked:border-primary transition-colors cursor-pointer focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-on-primary-container opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary text-[#002113] font-label-md text-label-md py-3 rounded-lg hover:bg-primary-fixed transition-colors mt-2 shadow-[0_0_15px_rgba(78,222,163,0.15)] flex items-center justify-center gap-2 group" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need field access? <a class="text-primary hover:text-primary-fixed transition-colors font-label-md text-label-md" href="#">Contact Admin</a>
</p>
</div>
</div>
</body></html>
